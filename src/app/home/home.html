<div>
  <div class="d-flex mb-4 align-items-center justify-content-around flex-wrap" style="gap: 6px">
    <p>Create Project</p>
    <div class="form-floating">
      <input id="project-name" type="text" class="form-control" placeholder="Project Name" name="projectName" [(ngModel)]="newProjectName"/>
      <label for="project-name">Project Name</label>
    </div>
    <div>
      <button type="button" class="btn btn-primary" (click)="createNewProject()">Create</button>
    </div>
  </div>

  <div class="d-flex mb-4 align-items-center justify-content-around flex-wrap" style="gap: 6px">
    @if (!!userProjects && userProjects.length! > 1) {
      <div class="dropdown">
        <button id="project-selection" type="button" class="btn btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" [disabled]="!selectedProject">
          {{selectedProject?.projectName || 'No projects available'}}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          @for(project of userProjects; track project.projectUid) {
            <li><button class="dropdown-item" (click)="changeSelectedProject(project)" [ngClass]="selectedProject?.projectUid === project.projectUid ? 'disabled' : ''">{{ project.projectName }}</button></li>
          }
        </ul>
      </div>
    }
    @else {
      <button id="project-selection" type="button" class="btn btn-outline-primary" [disabled]="true">
        {{selectedProject?.projectName || 'No projects available'}}
      </button>
    }
  </div>
</div>
