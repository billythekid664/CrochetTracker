  <div class="d-flex flex-column mb-4 align-items-center justify-content-around flex-wrap">
    <h2>Project</h2>
    @if (!!userProjects && userProjects.length! > 1) {
      <div class="btn-group dropdown">
        <button id="project-selection" type="button" class="btn btn-outline-primary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false" [disabled]="!selectedProject">
          {{selectedProject?.projectName || 'No projects available'}}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          @for(project of userProjects; track project.projectUid) {
            <li><button class="dropdown-item" (click)="changeSelectedProject(project)" [ngClass]="selectedProject?.projectUid === project.projectUid ? 'disabled' : ''">{{ project.projectName }}</button></li>
          }
        </ul>
        <button id="project-options" type="button" class="btn btn-outline-primary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-gear-fill pe-1"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button class="dropdown-item">TEST Button</button></li>
        </ul>
      </div>
    }
    @else {
      <div class="btn-group dropdown">
        <button id="project-selection" type="button" class="btn btn-outline-primary dropdown-toggle dropdown-toggle-split" [disabled]="true">
          {{selectedProject?.projectName || 'No projects available'}}
        </button>
        <button id="project-options" type="button" class="btn btn-outline-primary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-gear-fill pe-1"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button class="dropdown-item">TEST Button</button></li>
        </ul>
      </div>
    }
  </div>

  <div class="d-flex flex-column mb-4 align-items-center justify-content-around flex-wrap">
    <h2>Rounds</h2>
    <div class="d-flex flex-row align-items-center align-middle justify-content-around flex-wrap">
      <form [formGroup]="stitchForm" (ngSubmit)="onAddStitch()" class="d-flex flex-row align-items-center align-middle justify-content-around flex-wrap">
        <!-- Round number -->
        <div class="form-floating mb-3">
          <input type="number" class="form-control" id="roundNumber" formControlName="roundNumber" placeholder="Round Number">
          <label for="roundNumber">Round Number</label>
        </div>

        <!-- Stitch type -->
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="stitchType" formControlName="stitchType" placeholder="Stitch Type">
          <label for="stitchType">Stitch Type</label>
        </div>

        <!-- Count -->
        <div class="form-floating mb-3">
          <input type="number" class="form-control" id="count" formControlName="count" placeholder="Count">
          <label for="count">Count</label>
        </div>

        <!-- Add stitch -->
        <button type="submit" class="btn btn-primary">Add Stitch</button>
      </form>
    </div>
  </div>

  <div class="d-flex flex-column mb-4 align-items-center justify-content-around flex-wrap">
    <h2>Structure</h2>
    <div>
      <table class="table table-sm">
        <thead>
          <tr>
            <th scope="col">Round</th>
            <th scope="col">Type</th>
            <th scope="col">Quantity</th>
            <th scope="col">Total</th>
            <!-- <th scope="col">Actions</th> -->
          </tr>
        </thead>
        <tbody>
          <ng-container *ngFor="let round of rounds; let roundIdx = index;">
            <tr  *ngFor="let stitch of round.stitches; let stitchIdx = index; let first = first">
              <td *ngIf="first || isDragging" [attr.rowspan]="!isDragging ? round.stitches.length : 1">{{ round.orderNumber }}</td>
              <td>{{ stitch.type }}</td>
              <td>{{ stitch.quantity }}</td>
              <td *ngIf="first || isDragging" [attr.rowspan]="!isDragging ? round.stitches.length: 1">{{ round.totalStitches }}</td>
              <!-- <td><i class="bi bi-arrows-move"></i></td> -->
            </tr>
          </ng-container>
        </tbody>
      </table>
    </div>
